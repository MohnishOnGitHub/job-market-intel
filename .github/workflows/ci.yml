name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit and PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: job_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d job_market_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/job_market_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"
          cache: pip
      - name: Install runtime and test dependencies
        run: pip install -r requirements.txt
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/job_market_test
        run: python scripts/migrate.py
      - name: Run tests
        run: pytest --tb=short -ra

      # sentence-transformers / torch are intentionally omitted.
      # MiniLM evaluation is a manual/local step (large download).
